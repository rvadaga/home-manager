name: validate skills

# deliberately NOT filtered with `paths:`. the `skills-ref validate` check is
# required on main, and a workflow skipped by a path filter reports nothing at
# all — not success, not skipped — so a required check waits on it forever and
# the pr can never merge. every pr has to reach this job, including ones that
# touch no skill. the job takes seconds; a filter here costs a deadlock.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  skills-ref:
    name: skills-ref validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pinned: an unpinned spec bump would break CI on an unrelated pr
      - run: npm install -g skills-ref@0.1.5

      # skills-ref takes one skill path per run, so loop and collect failures
      # instead of stopping at the first bad skill.
      # `failed`, not `status` — the latter is read-only in zsh, so this same
      # loop can be pasted into a local shell to reproduce CI.
      - name: validate every skill against the agent skills spec
        run: |
          failed=0
          for dir in dotfiles/claude/skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            skills-ref validate "$dir" || failed=1
          done
          exit $failed
